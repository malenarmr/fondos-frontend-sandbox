name: Deploy Fondos to Vercel

on:
  push:
    branches:
      - main # solo main dispara el deploy
  workflow_dispatch: # ejecución manual
    inputs:
      environment:
        description: 'Seleccioná el entorno'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      # opcional: linkeo explícito usando secrets ORG y PROJECT
      - name: Link Vercel project
        run: |
          vercel link --yes \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --project=${{ secrets.VERCEL_PROJECT_ID }} \
            --org=${{ secrets.VERCEL_ORG_ID }}
      - name: Deploy to Vercel
        run: |
          ENV=${{ github.event.inputs.environment || 'production' }}
          echo "Deploying to $ENV environment"
          vercel deploy \
            --yes \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
